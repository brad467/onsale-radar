name: Debug Sales

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe
        env:
          TM_API_KEY: ${{ secrets.TM_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.parse, urllib.request, urllib.error
          from datetime import datetime, timezone, timedelta
          K = os.environ["TM_API_KEY"]
          B = "https://app.ticketmaster.com/discovery/v2"
          def api(path, **p):
              p["apikey"] = K
              u = f"{B}/{path}.json?" + urllib.parse.urlencode(p)
              try:
                  with urllib.request.urlopen(u, timeout=30) as r:
                      return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  return {"__err": f"HTTP {e.code}: {e.read().decode()[:200]}"}
          now = datetime.now(timezone.utc)
          Z = now.strftime("%Y-%m-%dT%H:%M:%SZ")
          print("NOW", Z)

          print("\n=== D: nationwide future onsales ===")
          for label, params in [
              ("onsaleStartDateTime=now", dict(onsaleStartDateTime=Z)),
              ("onsaleOnAfterStartDate=date", dict(onsaleOnAfterStartDate=now.strftime("%Y-%m-%d"))),
              ("onsaleOnStartDate=date", dict(onsaleOnStartDate=(now+timedelta(days=1)).strftime("%Y-%m-%d"))),
          ]:
              d = api("events", countryCode="US", classificationName="music",
                      size=20, sort="date,asc", **params)
              if "__err" in d:
                  print(f"  {label}: {d['__err']}"); continue
              tot = d.get("page", {}).get("totalElements")
              print(f"  {label}: totalElements={tot}")
              for e in d.get("_embedded", {}).get("events", [])[:8]:
                  s = (e.get("sales") or {}).get("public", {})
                  ps = (e.get("sales") or {}).get("presales", []) or []
                  nxt = [p for p in ps if (p.get("startDateTime") or "") > Z]
                  print("     ", e["name"][:40], "| pub:", s.get("startDateTime"),
                        "| future_presales:", len(nxt))

          print("\n=== E: sanity - any watched act with a future window? ===")
          for name in ["Sabrina Carpenter", "Morgan Wallen", "Taylor Swift", "Kendrick Lamar", "Dua Lipa"]:
              a = api("attractions", keyword=name, classificationName="music", size=1)
              embedded = a.get("_embedded", {}).get("attractions", [])
              if not embedded:
                  print(f"  {name}: no attraction"); continue
              d = api("events", attractionId=embedded[0]["id"], countryCode="US", size=100)
              evs = d.get("_embedded", {}).get("events", [])
              fut = []
              for e in evs:
                  s = e.get("sales") or {}
                  if (s.get("public") or {}).get("startDateTime", "") > Z:
                      fut.append(("public", e["name"][:30]))
                  for p in (s.get("presales") or []):
                      if (p.get("startDateTime") or "") > Z:
                          fut.append((p.get("name","presale")[:22], e["name"][:30]))
              print(f"  {name}: {len(evs)} events, {len(fut)} future windows", fut[:4])
          PY
